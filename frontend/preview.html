<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Assistant — ChatGPT Styled Application</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #383838; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
    
    .custom-markdown p { margin-bottom: 0.5rem; line-height: 1.6; }
    .custom-markdown ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .custom-markdown ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="bg-[#212121] text-[#ececec] font-sans antialiased overflow-hidden selection:bg-teal-500 selection:text-white">
  
  <div id="app" class="w-screen h-screen flex flex-col"></div>

  <script>
    const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname) ? 'http://localhost:8080' : window.location.origin;

    // Application State
    const state = {
      phase: 'INITIAL', // 'INITIAL' | 'PROCESSING' | 'DASHBOARD'
      activeTab: 'url', // 'url' | 'upload'
      youtubeUrl: '',
      uploadedFile: null,
      language: 'english',
      selectedFile: null,
      isCollapsed: false,
      backendConnected: false,
      processingStep: 'Downloading & converting audio track...',
      errorMsg: '',
      meetingData: {
        title: "",
        duration: "Full Video Transcript",
        sourceUrl: "",
        summary: [],
        actionItems: [],
        keyDecisions: [],
        openQuestions: []
      },
      messages: [],
      inputText: ''
    };

    // Helper: Parse string lines or bullets into clean Array
    function parseListItems(input) {
      if (Array.isArray(input)) return input;
      if (!input || typeof input !== 'string') return [];
      return input
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => line.replace(/^[\s\-*•\d+.]+\s*/, ''));
    }

    // Helper: Parse raw action item strings into task objects
    function parseActionItemObjects(input) {
      const lines = parseListItems(input);
      return lines.map((taskText, idx) => ({
        id: `act-${idx + 1}`,
        task: taskText.split(/[-–—]/)[0]?.trim() || taskText,
        owner: taskText.toLowerCase().includes('owner') ? taskText.split(/owner[:\s]*/i)[1]?.split(/[\n,]/)[0]?.trim() || 'Assigned' : 'Team Member',
        deadline: taskText.toLowerCase().includes('deadline') ? taskText.split(/deadline[:\s]*/i)[1]?.split(/[\n,]/)[0]?.trim() || 'Pending' : 'Not specified',
        completed: false
      }));
    }

    // Check backend connection on load
    async function checkBackendConnection() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/analyze`, { method: 'OPTIONS' });
        state.backendConnected = res.ok;
      } catch (e) {
        state.backendConnected = false;
      }
      render();
    }

    // Process & Analyze YouTube Video
    async function handleAnalyzeVideo(sourceUrl, lang) {
      state.phase = 'PROCESSING';
      state.errorMsg = '';
      state.processingStep = 'Downloading audio track & processing transcript...';
      render();

      try {
        const res = await fetch(`${API_BASE_URL}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: sourceUrl, language: lang })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && !data.error) {
          state.backendConnected = true;
          state.meetingData = {
            title: data.title || `Analysis of ${sourceUrl}`,
            duration: "Full Transcript",
            sourceUrl: sourceUrl,
            summary: parseListItems(data.summary),
            actionItems: parseActionItemObjects(data.action_items),
            keyDecisions: parseListItems(data.key_decisions),
            openQuestions: parseListItems(data.open_questions)
          };
          state.messages = [{
            id: 1,
            sender: 'assistant',
            text: `Hello! I've analyzed **"${state.meetingData.title}"**.\n\nYou can ask me anything about the transcript, summary, action items, or technical details discussed in this video.`,
            timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
            citations: []
          }];
          state.phase = 'DASHBOARD';
          render();
          return;
        } else if (data.error) {
          alert(`Server Analysis Error: ${data.error}`);
          state.phase = 'INITIAL';
          render();
          return;
        }
      } catch (e) {
        console.log("Backend API not reachable.", e);
      }

      // Fallback Dynamic Video Processor (only when backend is completely offline)
      state.backendConnected = false;
      simulateDynamicAnalysis(sourceUrl, lang);
    }

    // Process & Analyze Local Uploaded Video / Audio File
    async function handleAnalyzeLocalFile(file, lang) {
      if (!file) return;
      state.phase = 'PROCESSING';
      state.errorMsg = '';
      state.processingStep = `Reading local file "${file.name}"...`;
      render();

      const reader = new FileReader();
      reader.onload = async function(e) {
        const filedata = e.target.result;
        state.processingStep = `Uploading "${file.name}" to server...`;
        render();

        try {
          const res = await fetch(`${API_BASE_URL}/api/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, filedata: filedata, language: lang })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && !data.error) {
            state.backendConnected = true;
            state.meetingData = {
              title: data.title || file.name,
              duration: "Full Local Audio/Video",
              sourceUrl: file.name,
              summary: parseListItems(data.summary),
              actionItems: parseActionItemObjects(data.action_items),
              keyDecisions: parseListItems(data.key_decisions),
              openQuestions: parseListItems(data.open_questions)
            };
            state.messages = [{
              id: 1,
              sender: 'assistant',
              text: `Hello! I've analyzed your local file **"${state.meetingData.title}"**.\n\nYou can ask me questions about the transcript, summary, action items, or technical topics!`,
              timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
              citations: []
            }];
            state.phase = 'DASHBOARD';
            render();
            return;
          } else if (data.error) {
            alert(`Server Upload Error: ${data.error}`);
            state.phase = 'INITIAL';
            render();
            return;
          }
        } catch (err) {
          console.log("Backend file upload error", err);
        }

        state.backendConnected = false;
        simulateDynamicAnalysis(file.name, lang);
      };
      reader.readAsDataURL(file);
    }

    function simulateDynamicAnalysis(sourceUrl, lang) {
      let videoId = sourceUrl;
      if (sourceUrl.includes("v=")) {
        videoId = sourceUrl.split("v=")[1].split("&")[0];
      }

      setTimeout(() => { state.processingStep = "Transcribing speech via Whisper / Sarvam AI..."; render(); }, 800);
      setTimeout(() => { state.processingStep = "Extracting summary, decisions & action items..."; render(); }, 1600);
      setTimeout(() => {
        state.meetingData = {
          title: `Analysis of ${videoId}`,
          duration: "Full Transcript",
          sourceUrl: sourceUrl,
          summary: [
            `Processed media source: ${sourceUrl}`,
            `Transcribed speech audio using ${lang === 'hinglish' ? 'Sarvam AI' : 'OpenAI Whisper model'}.`,
            `Extracted meeting topics, key decisions, and action items automatically.`,
            `Indexed document chunks into Chroma DB vector store for context-bounded RAG query retrieval.`
          ],
          actionItems: [
            { id: "1", task: `Review extracted transcript insights for ${videoId}`, owner: "Reviewer", deadline: "Immediate", completed: false }
          ],
          keyDecisions: [
            `Selected ${lang === 'hinglish' ? 'Sarvam AI STT' : 'Whisper STT'} engine for processing this video track.`
          ],
          openQuestions: [
            `Would you like to ask specific questions about timestamps or topics in this video?`
          ]
        };

        state.messages = [{
          id: 1,
          sender: 'assistant',
          text: `Hello! I've processed your media file **"${state.meetingData.title}"**.\n\n*(Note: Python backend server is currently offline. Start \`npm run dev\` in your terminal for live Whisper & RAG query processing.)*`,
          timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
          citations: []
        }];

        state.phase = 'DASHBOARD';
        render();
      }, 2400);
    }

    // Submit Question to RAG Chat
    async function submitQuestion(questionText) {
      const userMsg = { 
        id: Date.now(), 
        sender: 'user', 
        text: questionText, 
        timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
      };
      state.messages.push(userMsg);
      render();

      // Try sending question to real backend API /api/chat
      try {
        const res = await fetch(`${API_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: questionText })
        });

        if (res.ok) {
          const data = await res.json();
          state.backendConnected = true;
          const aiMsg = { 
            id: Date.now() + 1, 
            sender: 'assistant', 
            text: data.answer || "Answer retrieved from transcript context.", 
            timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
            citations: [{ timestamp: "Transcript Context", text: "Retrieved from Chroma DB RAG store." }]
          };
          state.messages.push(aiMsg);
          render();
          scrollToBottom();
          return;
        }
      } catch (e) {
        console.log("Backend chat API not reachable.");
      }

      // Offline Answer Engine (when backend API server is offline)
      setTimeout(() => {
        const ragAnswer = getRAGAnswer(questionText);
        const aiMsg = { 
          id: Date.now() + 1, 
          sender: 'assistant', 
          text: ragAnswer.text, 
          timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
          citations: ragAnswer.citations
        };
        state.messages.push(aiMsg);
        render();
        scrollToBottom();
      }, 500);
    }

    function getRAGAnswer(question) {
      const q = question.toLowerCase().trim();
      const title = state.meetingData.title;

      if (q.includes("topic") || q.includes("about") || q.includes("overview") || q.includes("what is this") || q.includes("subject")) {
        return {
          text: `The topic of this media is **"${title}"**.\n\n### Summary of Topics:\n${state.meetingData.summary.map(s => `- ${s}`).join("\n")}`,
          citations: [{ timestamp: "00:30 - 02:15", text: "Introduction and main subject discussion." }]
        };
      }

      if (q.includes("summary") || q.includes("summarize") || q.includes("highlights")) {
        return {
          text: `Executive summary for **"${title}"**:\n\n${state.meetingData.summary.map(s => `- ${s}`).join("\n")}`,
          citations: [{ timestamp: "03:10 - 06:40", text: "Summary review segment." }]
        };
      }

      if (q.includes("action item") || q.includes("task list") || q.includes("assigned")) {
        const items = state.meetingData.actionItems.map((item, idx) => 
          `${idx + 1}. **${item.task}** — Assigned to **${item.owner}** *(Deadline: ${item.deadline})*`
        ).join("\n");
        return {
          text: `Action items for **"${title}"**:\n\n${items}`,
          citations: [{ timestamp: "14:20 - 17:05", text: "Action item extraction block." }]
        };
      }

      return {
        text: `Regarding your question *"${question}"* on **"${title}"**:\n\n*(The Python RAG server on port 8080 is currently offline. Run \`npm run dev\` in your terminal to enable live RAG querying over the full transcript.)*`,
        citations: []
      };
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    // Helper: Escaping HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Helper: Simple Markdown formatting
    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br/>');
    }

    // Render Views
    function render() {
      const app = document.getElementById('app');
      if (state.phase === 'INITIAL') {
        app.innerHTML = renderInitialScreen();
      } else if (state.phase === 'PROCESSING') {
        app.innerHTML = renderProcessingScreen();
      } else {
        app.innerHTML = renderDashboard();
      }
      attachEventListeners();
    }

    function renderInitialScreen() {
      return `
        <div class="flex-1 flex flex-col justify-between items-center p-6 text-center overflow-y-auto">
          <header class="w-full max-w-4xl flex justify-between items-center py-2">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 rounded-lg bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 font-bold">✨</div>
              <span class="font-semibold text-lg text-white">AI Video Assistant</span>
            </div>
            <div class="flex items-center space-x-2">
              <span class="text-xs ${state.backendConnected ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-[#2f2f2f] text-gray-400 border-[#383838]'} px-3 py-1 rounded-full border flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full ${state.backendConnected ? 'bg-emerald-400 animate-pulse' : 'bg-gray-500'}"></span>
                ${state.backendConnected ? 'Python API Connected (Port 8080)' : 'Standalone Preview Mode'}
              </span>
            </div>
          </header>

          <main class="w-full max-w-2xl my-auto space-y-6 py-6">
            <div class="space-y-2">
              <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">What video would you like to analyze?</h1>
              <p class="text-sm text-gray-400 max-w-lg mx-auto">Paste a YouTube URL or upload a local video/audio file to extract transcripts, action items, summaries & chat with RAG.</p>
            </div>

            <!-- Mode Selector Tabs -->
            <div class="flex items-center justify-center p-1 bg-[#212121] border border-[#383838] rounded-xl max-w-xs mx-auto text-xs font-medium">
              <button id="tab-url-btn" type="button" class="flex-1 py-2 px-3 rounded-lg transition-all ${state.activeTab === 'url' ? 'bg-teal-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}">
                🔗 YouTube URL
              </button>
              <button id="tab-upload-btn" type="button" class="flex-1 py-2 px-3 rounded-lg transition-all ${state.activeTab === 'upload' ? 'bg-teal-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}">
                📁 Upload Local File
              </button>
            </div>

            <form id="analyze-form" class="bg-[#2f2f2f] border border-[#383838] rounded-2xl p-5 shadow-2xl space-y-4 text-left">
              ${state.activeTab === 'url' ? `
                <div>
                  <label class="block text-xs font-medium text-gray-400 mb-1">YouTube Video URL</label>
                  <input 
                    id="youtube-url-input"
                    type="url" 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    value="${escapeHtml(state.youtubeUrl)}"
                    required
                    class="w-full pl-4 pr-4 py-3 bg-[#212121] border border-[#383838] rounded-xl text-sm text-white focus:outline-none focus:border-teal-500"
                  />
                </div>
              ` : `
                <div>
                  <label class="block text-xs font-medium text-gray-400 mb-1">Select Video or Audio File (.mp4, .mov, .mp3, .wav, .m4a)</label>
                  <div id="file-dropzone" class="cursor-pointer border-2 border-dashed ${state.uploadedFile ? 'border-teal-500/60 bg-teal-950/20' : 'border-[#383838] hover:border-teal-500/50 bg-[#212121]'} rounded-xl p-6 text-center transition-all">
                    <input id="local-file-input" type="file" accept="video/*,audio/*,.mp4,.mov,.avi,.mkv,.webm,.mp3,.wav,.m4a" class="hidden" />
                    <div class="space-y-1">
                      <div class="text-2xl">${state.uploadedFile ? '🎬' : '📁'}</div>
                      <p class="text-xs text-white font-medium">
                        ${state.uploadedFile ? escapeHtml(state.uploadedFile.name) : 'Click to browse or drag & drop video/audio file here'}
                      </p>
                      <p class="text-[10px] text-gray-400">
                        ${state.uploadedFile ? (state.uploadedFile.size / (1024 * 1024)).toFixed(2) + ' MB' : 'Supports MP4, MOV, AVI, MP3, WAV, M4A'}
                      </p>
                    </div>
                  </div>
                </div>
              `}

              <div class="flex items-center justify-between gap-3 pt-2">
                <div class="flex items-center space-x-2 bg-[#212121] px-3 py-2 border border-[#383838] rounded-xl text-xs">
                  <span class="text-gray-400">Language:</span>
                  <select id="language-select" class="bg-transparent text-white focus:outline-none cursor-pointer">
                    <option value="english" ${state.language === 'english' ? 'selected' : ''}>English (Whisper)</option>
                    <option value="hinglish" ${state.language === 'hinglish' ? 'selected' : ''}>Hinglish (Sarvam AI)</option>
                  </select>
                </div>

                <button type="submit" class="flex-1 bg-teal-600 hover:bg-teal-500 text-white font-medium text-sm py-2.5 px-6 rounded-xl transition-all shadow-lg shadow-teal-900/20 active:scale-[0.98]">
                  Analyze Video →
                </button>
              </div>
            </form>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
              <button data-url="https://www.youtube.com/watch?v=B7eVfMuL9Es&t=345s" class="sample-btn p-3 bg-[#2f2f2f]/60 hover:bg-[#2f2f2f] border border-[#383838] rounded-xl text-left transition-all">
                <span class="text-[10px] text-teal-400 font-semibold block mb-0.5">Sample Video</span>
                <p class="font-medium text-white truncate">YouTube Video (B7eVfMuL9Es)</p>
              </button>
              <button data-url="https://www.youtube.com/watch?v=IA0la6XEi4Q" class="sample-btn p-3 bg-[#2f2f2f]/60 hover:bg-[#2f2f2f] border border-[#383838] rounded-xl text-left transition-all">
                <span class="text-[10px] text-teal-400 font-semibold block mb-0.5">AI Architecture</span>
                <p class="font-medium text-white truncate">Q3 Sarvam AI Integration Sync</p>
              </button>
              <button data-url="https://www.youtube.com/watch?v=OxEMHsCKTWo" class="sample-btn p-3 bg-[#2f2f2f]/60 hover:bg-[#2f2f2f] border border-[#383838] rounded-xl text-left transition-all">
                <span class="text-[10px] text-teal-400 font-semibold block mb-0.5">Audio Pipeline</span>
                <p class="font-medium text-white truncate">Hinglish STT Benchmarks</p>
              </button>
            </div>
          </main>

          <footer class="text-xs text-gray-500 py-2">Powered by Whisper, Sarvam AI, Chroma DB & Mistral LLM</footer>
        </div>
      `;
    }

    function renderProcessingScreen() {
      return `
        <div class="flex-1 flex flex-col justify-center items-center p-4">
          <div class="w-full max-w-md bg-[#2f2f2f] border border-[#383838] rounded-2xl p-8 text-center space-y-6 shadow-2xl">
            <div class="w-12 h-12 rounded-2xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 mx-auto text-xl animate-bounce">⚙️</div>
            <h2 class="text-xl font-bold text-white">Analyzing Video & Transcript</h2>
            <div class="w-full bg-[#212121] h-2 rounded-full overflow-hidden border border-[#383838]">
              <div class="bg-gradient-to-r from-teal-500 to-emerald-400 h-full w-3/4 animate-pulse"></div>
            </div>
            <div class="text-xs text-gray-300 space-y-2.5 text-left bg-[#212121] p-4 rounded-xl border border-[#383838]">
              <p class="flex items-center space-x-2 text-teal-400 font-medium"><span>⚡</span><span>${escapeHtml(state.processingStep)}</span></p>
              <p class="flex items-center space-x-2 text-gray-500"><span>⏳</span><span>Indexing vector embeddings into Chroma DB...</span></p>
            </div>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      const completedCount = state.meetingData.actionItems.filter(a => a.completed).length;
      const totalCount = state.meetingData.actionItems.length;

      return `
        <div class="flex-1 flex h-full overflow-hidden">
          
          <!-- Sidebar -->
          <aside class="${state.isCollapsed ? 'w-14' : 'w-[320px]'} bg-[#171717] border-r border-[#2e2e2e] flex flex-col transition-all duration-200 flex-shrink-0">
            <div class="p-3 border-b border-[#2e2e2e] flex justify-between items-center gap-2">
              ${!state.isCollapsed ? `
                <button id="btn-new-analysis" class="flex-1 bg-[#212121] hover:bg-[#2a2a2a] text-white text-xs font-medium py-2 px-3 rounded-xl border border-[#333] flex items-center justify-center space-x-2 transition-colors">
                  <span class="text-teal-400">+</span><span>New Analysis</span>
                </button>
              ` : ''}
              <button id="btn-toggle-sidebar" class="p-2 text-gray-400 hover:text-white rounded-lg transition-colors">
                ${state.isCollapsed ? '➡️' : '⬅️'}
              </button>
            </div>

            ${!state.isCollapsed ? `
              <div class="flex-1 overflow-y-auto p-3 space-y-3 text-xs">
                
                <!-- Title Card -->
                <div class="bg-[#212121] border border-[#2e2e2e] rounded-xl p-3 space-y-1">
                  <span class="text-[10px] text-teal-400 font-bold bg-teal-500/10 px-2 py-0.5 rounded border border-teal-500/20">📌 Meeting Context</span>
                  <h2 class="font-semibold text-white text-sm leading-snug">${escapeHtml(state.meetingData.title)}</h2>
                  ${state.meetingData.sourceUrl ? `<a href="${escapeHtml(state.meetingData.sourceUrl)}" target="_blank" class="text-[11px] text-teal-400 hover:underline truncate block">🔗 ${escapeHtml(state.meetingData.sourceUrl)}</a>` : ''}
                </div>

                <!-- Executive Summary -->
                <div class="bg-[#212121] border border-[#2e2e2e] rounded-xl p-3 space-y-2">
                  <h3 class="font-semibold text-blue-400 flex items-center space-x-1"><span>📋</span><span>Executive Summary</span></h3>
                  <ul class="space-y-1.5 text-gray-300">
                    ${state.meetingData.summary.map(s => `<li class="flex items-start space-x-1.5"><span class="text-teal-400 font-bold">•</span><span>${escapeHtml(s)}</span></li>`).join('')}
                  </ul>
                </div>

                <!-- Action Items Checklist -->
                <div class="bg-[#212121] border border-[#2e2e2e] rounded-xl p-3 space-y-2">
                  <div class="flex items-center justify-between font-semibold text-emerald-400">
                    <span class="flex items-center space-x-1"><span>✅</span><span>Action Items</span></span>
                    <span class="text-[10px] bg-[#2e2e2e] px-2 py-0.5 rounded text-emerald-400 font-mono">${completedCount}/${totalCount}</span>
                  </div>
                  <div class="space-y-2">
                    ${state.meetingData.actionItems.map(item => `
                      <div data-task-id="${item.id}" class="task-item p-2 rounded-lg cursor-pointer transition-colors ${item.completed ? 'bg-[#1a1a1a] opacity-60' : 'bg-[#282828] hover:bg-[#303030]'}">
                        <div class="flex items-start space-x-2">
                          <span class="text-emerald-400 font-bold">${item.completed ? '☑' : '☐'}</span>
                          <div>
                            <p class="font-medium ${item.completed ? 'line-through text-gray-500' : 'text-gray-200'}">${escapeHtml(item.task)}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">👤 ${escapeHtml(item.owner)} • 📅 ${escapeHtml(item.deadline)}</p>
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <!-- Key Decisions -->
                <div class="bg-[#212121] border border-[#2e2e2e] rounded-xl p-3 space-y-2">
                  <h3 class="font-semibold text-amber-400 flex items-center space-x-1"><span>🔑</span><span>Key Decisions</span></h3>
                  <ul class="space-y-1.5 text-gray-300">
                    ${state.meetingData.keyDecisions.map(d => `<li class="bg-[#262626] p-2 rounded border border-[#303030] text-gray-200">✓ ${escapeHtml(d)}</li>`).join('')}
                  </ul>
                </div>

              </div>
            ` : ''}
          </aside>

          <!-- Main RAG Chat Area -->
          <main class="flex-1 flex flex-col bg-[#212121] relative overflow-hidden">
            <header class="h-14 border-b border-[#2e2e2e] px-4 flex items-center justify-between bg-[#212121]">
              <div class="flex items-center space-x-2">
                <span class="text-teal-400 font-bold">✨</span>
                <span class="font-semibold text-sm text-white">RAG Assistant Chat</span>
              </div>
              <span class="text-xs font-mono text-gray-400 bg-[#2f2f2f] px-2.5 py-1 rounded border border-[#383838]">mistral-small-latest</span>
            </header>

            <!-- Chat Messages Window -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
              <div class="max-w-3xl mx-auto space-y-4">
                ${state.messages.map(msg => `
                  <div class="flex gap-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}">
                    ${msg.sender === 'assistant' ? `<div class="w-7 h-7 rounded-full bg-teal-600 flex items-center justify-center text-xs text-white flex-shrink-0">✨</div>` : ''}
                    <div class="max-w-[82%] p-3.5 rounded-2xl text-sm ${msg.sender === 'user' ? 'bg-[#2f2f2f] text-white border border-[#383838]' : 'bg-[#212121] border border-[#2f2f2f] text-gray-200'}">
                      <div class="whitespace-pre-wrap custom-markdown">${formatMarkdown(msg.text)}</div>
                    </div>
                    ${msg.sender === 'user' ? `<div class="w-7 h-7 rounded-full bg-gray-700 flex items-center justify-center text-xs text-white flex-shrink-0">👤</div>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Sticky Chat Input Bar -->
            <div class="p-4 border-t border-[#2e2e2e] bg-[#212121]">
              <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
                <input 
                  id="chat-input"
                  type="text" 
                  placeholder="Ask a question about this meeting..." 
                  value="${escapeHtml(state.inputText)}"
                  class="flex-1 px-4 py-3 bg-[#2f2f2f] border border-[#383838] rounded-xl text-sm text-white focus:outline-none focus:border-[#676767]"
                />
                <button type="submit" class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-5 py-3 rounded-xl transition-all shadow-md active:scale-95">Send</button>
              </form>
            </div>

          </main>
        </div>
      `;
    }

    // Attach Event Listeners
    function attachEventListeners() {
      const tabUrlBtn = document.getElementById('tab-url-btn');
      const tabUploadBtn = document.getElementById('tab-upload-btn');

      if (tabUrlBtn) {
        tabUrlBtn.addEventListener('click', () => {
          state.activeTab = 'url';
          render();
        });
      }

      if (tabUploadBtn) {
        tabUploadBtn.addEventListener('click', () => {
          state.activeTab = 'upload';
          render();
        });
      }

      const fileDropzone = document.getElementById('file-dropzone');
      const localFileInput = document.getElementById('local-file-input');

      if (fileDropzone && localFileInput) {
        fileDropzone.addEventListener('click', () => {
          localFileInput.click();
        });

        localFileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            state.uploadedFile = e.target.files[0];
            render();
          }
        });

        fileDropzone.addEventListener('dragover', (e) => {
          e.preventDefault();
          fileDropzone.classList.add('border-teal-500');
        });

        fileDropzone.addEventListener('dragleave', (e) => {
          e.preventDefault();
          fileDropzone.classList.remove('border-teal-500');
        });

        fileDropzone.addEventListener('drop', (e) => {
          e.preventDefault();
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            state.uploadedFile = e.dataTransfer.files[0];
            render();
          }
        });
      }

      const analyzeForm = document.getElementById('analyze-form');
      if (analyzeForm) {
        analyzeForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const langSelect = document.getElementById('language-select');
          const lang = langSelect ? langSelect.value : 'english';

          if (state.activeTab === 'url') {
            const urlInput = document.getElementById('youtube-url-input');
            if (urlInput && urlInput.value) {
              state.youtubeUrl = urlInput.value;
              handleAnalyzeVideo(urlInput.value, lang);
            }
          } else {
            if (state.uploadedFile) {
              handleAnalyzeLocalFile(state.uploadedFile, lang);
            } else {
              alert("Please select a local video or audio file first!");
            }
          }
        });
      }

      document.querySelectorAll('.sample-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.getAttribute('data-url');
          if (url) {
            state.youtubeUrl = url;
            state.activeTab = 'url';
            handleAnalyzeVideo(url, 'english');
          }
        });
      });

      const btnNew = document.getElementById('btn-new-analysis');
      if (btnNew) {
        btnNew.addEventListener('click', () => {
          state.phase = 'INITIAL';
          state.youtubeUrl = '';
          render();
        });
      }

      const btnToggle = document.getElementById('btn-toggle-sidebar');
      if (btnToggle) {
        btnToggle.addEventListener('click', () => {
          state.isCollapsed = !state.isCollapsed;
          render();
        });
      }

      document.querySelectorAll('.task-item').forEach(item => {
        item.addEventListener('click', () => {
          const taskId = item.getAttribute('data-task-id');
          state.meetingData.actionItems = state.meetingData.actionItems.map(t => 
            t.id === taskId ? { ...t, completed: !t.completed } : t
          );
          render();
        });
      });

      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      if (chatForm && chatInput) {
        chatInput.addEventListener('input', (e) => {
          state.inputText = e.target.value;
        });

        chatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!state.inputText.trim()) return;
          const userText = state.inputText.trim();
          state.inputText = '';
          submitQuestion(userText);
        });
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code class="bg-[#2f2f2f] px-1 py-0.5 rounded text-teal-300 font-mono text-xs">$1</code>')
        .replace(/### (.*?)\n/g, '<h3 class="text-base font-bold text-white mt-2 mb-1">$1</h3>');
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', () => {
      checkBackendConnection();
      render();
    });
  </script>
</body>
</html>
